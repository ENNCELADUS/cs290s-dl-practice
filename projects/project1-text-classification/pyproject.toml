[project]
name = "project1-text-classification"
version = "0.1.0"
description = "CS290S Project 1 starter for text classification experiments."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "huggingface_hub>=0.34,<1",
    "numpy<2",
    "tensorboard==2.20.0",
    "torch==2.2.2",
    "transformers>=4.41,<4.42",
    "tqdm==4.67.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.11,<0.12",
]

[tool.uv]
package = false
