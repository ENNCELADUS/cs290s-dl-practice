[project]
name = "project2-pretrain-gpt"
version = "0.1.0"
description = "From-scratch GPT pretraining scaffold for CS290S Project 2."
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.0",
    "datasets>=2.18",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "tensorboard>=2.16",
    "torch>=2.2",
    "tqdm>=4.66",
    "transformers>=4.40",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
